name: MLB data pull
on:
  schedule:
    - cron: "20 10 * * *"   # every day, 6:20 AM ET (EDT) / 5:20 AM EST, before the Line Desk's 9:13 AM ratings run
    - cron: "20 15 * * *"   # and 11:20 AM ET, as a backup if the morning run is delayed
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: mlb-pull
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas pyarrow
      - name: Pull finished games from the MLB Stats API
        run: python pull_mlb.py
      - name: Publish to the "data" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "MLB data" --notes "Daily MLB Stats API pull for the MLB Line Desk. Files are replaced on every run."
          gh release upload data out/* --clobber
      - name: Keep the schedule alive (GitHub pauses scheduled workflows after 60 days without a commit)
        run: |
          git config user.name "mlb-data-bot"
          git config user.email "mlb-data-bot@users.noreply.github.com"
          git add last_run.txt
          git commit -m "data pull $(date -u +%F)" || true
          git push || true
