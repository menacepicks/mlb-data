name: Odds poll
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: odds-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Poll The Odds API (opening + current lines)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pull_odds.py
      - name: Publish to the "odds" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view odds >/dev/null 2>&1 || gh release create odds --title "Odds" --notes "Opening and current lines, refreshed every 15 minutes. Files are replaced on every run."
          gh release upload odds out/* --clobber
